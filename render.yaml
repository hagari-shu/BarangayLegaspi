services:
  - type: web
    name: brgy-legaspi-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: brgy-legaspi-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: RESET_DELIVERY_URL
        sync: false

databases:
  - name: brgy-legaspi-db
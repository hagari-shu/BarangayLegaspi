services:
  - type: web
    name: brgy-legaspi-laravel
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./laravel-api/Dockerfile
    dockerContext: ./laravel-api
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

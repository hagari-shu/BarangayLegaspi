services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.hostinger}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.hostinger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.hostinger}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - database

  laravel-api:
    build:
      context: ./laravel-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env.hostinger}
      APP_URL: https://${DOMAIN:?Set DOMAIN in .env.hostinger}
      APP_TIMEZONE: Asia/Manila
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env.hostinger}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env.hostinger}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.hostinger}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.hostinger}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY in .env.hostinger}
      CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env.hostinger}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env.hostinger}
      ADMIN_MOBILE: ${ADMIN_MOBILE:?Set ADMIN_MOBILE in .env.hostinger}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.hostinger}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-false}
      RESET_DELIVERY_URL: ${RESET_DELIVERY_URL:-}
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - database

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    depends_on:
      - laravel-api
    networks:
      - public
      - app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.hostinger}
      STAGING_ALLOWED_CIDR: ${STAGING_ALLOWED_CIDR:?Set STAGING_ALLOWED_CIDR in .env.hostinger}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - public

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  public:
  app:
  database:
    internal: true

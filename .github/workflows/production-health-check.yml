name: Production health check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-health-check.yml'

permissions:
  contents: read

jobs:
  check-production:
    name: Check production services
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check production frontend
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 25 \
            --output /dev/null \
            --write-out 'Production frontend returned HTTP %{http_code} in %{time_total}s\n' \
            https://barangay-legaspi.vercel.app/

      - name: Check publicly available Hostinger migration candidate
        run: |
          set -euo pipefail
          for path in / /register; do
            curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 25 \
              --output /dev/null \
              --write-out "Hostinger candidate ${path} returned HTTP %{http_code} in %{time_total}s\n" \
              "https://barangaylegaspi.tech${path}"
          done
          body="$(curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 25 \
            https://barangaylegaspi.tech/api/health)"
          printf '%s' "$body" | node -e '
            let health;
            try { health = JSON.parse(require("fs").readFileSync(0, "utf8")); }
            catch { console.error("Hostinger candidate health endpoint did not return valid JSON."); process.exit(1); }
            if (health.ok !== true || health.storage !== "postgres") {
              console.error("Hostinger candidate health check failed or PostgreSQL is unavailable:", health);
              process.exit(1);
            }
            console.log(`Hostinger candidate API healthy; storage=${health.storage}`);
          '

      - name: Check API health and PostgreSQL
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 25 \
            https://barangaylegaspi.onrender.com/api/health)"
          printf '%s' "$body" | node -e '
            let health;
            try { health = JSON.parse(require("fs").readFileSync(0, "utf8")); }
            catch { console.error("Health endpoint did not return valid JSON."); process.exit(1); }
            if (health.ok !== true || health.storage !== "postgres") {
              console.error("API health check failed or PostgreSQL is unavailable:", health);
              process.exit(1);
            }
            console.log(`Active Node API healthy; storage=${health.storage}`);
          '

      - name: Check public profile photo embedding policy
        run: |
          set -euo pipefail
          for role in captain secretary treasurer; do
            headers="$(curl --silent --show-error --max-time 25 \
              --dump-header - --output /dev/null \
              "https://barangaylegaspi.onrender.com/api/official-profiles/${role}/photo")"
            if ! printf '%s\n' "$headers" | tr -d '\r' | grep --ignore-case --quiet '^cross-origin-resource-policy: cross-origin$'; then
              echo "Public ${role} photo endpoint does not allow embedding from the separate frontend origin."
              exit 1
            fi
          done
          echo 'Public official photo endpoints allow cross-origin embedding.'

      - name: Check staged Laravel API health
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 25 \
            https://brgy-legaspi-laravel.onrender.com/api/health)"
          printf '%s' "$body" | node -e '
            let health;
            try { health = JSON.parse(require("fs").readFileSync(0, "utf8")); }
            catch { console.error("Laravel health endpoint did not return valid JSON."); process.exit(1); }
            if (health.ok !== true || health.storage !== "pgsql") {
              console.error("Staged Laravel API health check failed or PostgreSQL is unavailable:", health);
              process.exit(1);
            }
            console.log(`Staged Laravel API healthy; storage=${health.storage}`);
          '

      - name: Check public API reads
        run: |
          set -euo pipefail
          check_collection() {
            local endpoint="$1"
            local key="$2"
            local api_base="$3"
            local body
            body="$(curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 25 \
              "${api_base}/${endpoint}")"
            printf '%s' "$body" | node -e '
              const key = process.argv[1];
              let data;
              try { data = JSON.parse(require("fs").readFileSync(0, "utf8")); }
              catch { console.error(`${key} endpoint did not return valid JSON.`); process.exit(1); }
              if (!Array.isArray(data[key])) {
                console.error(`${key} endpoint returned an unexpected response shape.`);
                process.exit(1);
              }
              const demoTitles = new Set([
                "Barangay health drive",
                "Tree planting program",
                "Senior citizen support session",
                "Free vaccination schedule",
                "Senior citizen ID renewal",
                "Clean-up drive reminder",
                "Emergency hotline now active"
              ]);
              if (data[key].some((record) => demoTitles.has(record?.title))) {
                console.error(`${key} endpoint is returning known demonstration content.`);
                process.exit(1);
              }
              console.log(`${key} endpoint healthy; ${data[key].length} records`);
            ' "$key"
          }
          check_collection services services https://barangaylegaspi.onrender.com/api
          check_collection announcements announcements https://barangaylegaspi.onrender.com/api
          check_collection events events https://barangaylegaspi.onrender.com/api
          check_collection announcements announcements https://brgy-legaspi-laravel.onrender.com/api
          check_collection events events https://brgy-legaspi-laravel.onrender.com/api

      - name: Verify Laravel public content matches the active Node API
        run: |
          set -euo pipefail
          node - <<'NODE'
          const sources = {
            node: "https://barangaylegaspi.onrender.com/api",
            laravel: "https://brgy-legaspi-laravel.onrender.com/api",
          };
          async function collection(api, key) {
            const response = await fetch(`${api}/${key}`, { signal: AbortSignal.timeout(25000) });
            if (!response.ok) throw new Error(`${key} endpoint at ${api} returned HTTP ${response.status}`);
            const payload = await response.json();
            if (!Array.isArray(payload[key])) throw new Error(`${key} endpoint at ${api} returned an invalid collection`);
            return payload[key];
          }
          for (const key of ["announcements", "events"]) {
            const [canonical, mirrored] = await Promise.all([
              collection(sources.node, key),
              collection(sources.laravel, key),
            ]);
            if (JSON.stringify(canonical) !== JSON.stringify(mirrored)) {
              throw new Error(`${key} differs between the active Node API and Laravel`);
            }
            console.log(`${key} consistent across both APIs; ${canonical.length} records`);
          }
          NODE

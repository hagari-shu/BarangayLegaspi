name: Laravel API tests

on:
  push:
    branches:
      - '**'
    paths:
      - 'laravel-api/**'
      - 'server/**'
      - 'scripts/check-laravel-api-parity.js'
      - 'package.json'
      - 'render.yaml'
      - '.github/workflows/laravel-tests.yml'
  pull_request:
    paths:
      - 'laravel-api/**'
      - 'server/**'
      - 'scripts/check-laravel-api-parity.js'
      - 'package.json'
      - 'render.yaml'
      - '.github/workflows/laravel-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-laravel:
    name: Test Laravel API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: laravel-api
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prevent Laravel API parity regressions
        working-directory: .
        run: node scripts/check-laravel-api-parity.js --max-missing=0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, pdo_sqlite, zip
          coverage: none

      - name: Install Composer dependencies
        env:
          APP_ENV: testing
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel test environment
        run: cp .env.example .env

      - name: Run Laravel tests
        env:
          APP_ENV: testing
          APP_KEY: 'base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='
        run: php artisan test

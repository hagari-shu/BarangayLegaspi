name: Production account role assignment and invitations

on:
  workflow_dispatch:
    inputs:
      action:
        description: Account role assignment or invitation
        type: choice
        required: true
        options:
          - promote-admin
          - invite-admin
          - promote-super-admin
          - invite-super-admin
          - invite-staff
      email:
        description: Account holder email, or existing verified account email for promotion
        type: string
        required: true
      mobile:
        description: Required for promotion; omitted for account invitations
        type: string
        required: false
      position:
        description: Optional Staff position (defaults to Staff)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: production-account-role-assignment
  cancel-in-progress: false

jobs:
  assign-role:
    name: Assign a production account role
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Require explicit workflow enablement
        env:
          WORKFLOW_ENABLED: ${{ vars.PRODUCTION_ACCOUNT_WORKFLOW_ENABLED }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_ENABLED" != "true" ]]; then
            echo "Role assignment is disabled. Review and enable the protected production environment first."
            exit 1
          fi
          if [[ -z "$PUBLIC_APP_URL" ]]; then
            echo "Set PUBLIC_APP_URL in the production environment to the deployed official HTTPS portal origin."
            exit 1
          fi
          node -e '
            const url = new URL(process.env.PUBLIC_APP_URL);
            if (url.protocol !== "https:" || url.username || url.password || url.pathname !== "/" || url.search || url.hash) {
              console.error("PUBLIC_APP_URL must be an HTTPS origin without credentials, path, query, or fragment.");
              process.exit(1);
            }
          '
          curl --fail --location --silent --show-error --max-time 25 \
            --output /dev/null "$PUBLIC_APP_URL"
          echo "Official HTTPS portal is responding."

      - name: Mask and validate account details
        env:
          ACCOUNT_ACTION: ${{ inputs.action }}
          ACCOUNT_EMAIL: ${{ inputs.email }}
          ACCOUNT_MOBILE: ${{ inputs.mobile }}
          STAFF_POSITION: ${{ inputs.position }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ACCOUNT_EMAIL"
          echo "::add-mask::$STAFF_POSITION"
          if [[ ! "$ACCOUNT_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]]; then
            echo "Provide a valid account email."
            exit 1
          fi
          case "$ACCOUNT_ACTION" in
            promote-admin|promote-super-admin)
              echo "::add-mask::$ACCOUNT_MOBILE"
              if [[ ! "$ACCOUNT_MOBILE" =~ ^09[0-9]{9}$ ]]; then
                echo "Provide a valid Philippine mobile number for promotion."
                exit 1
              fi
              ;;
            invite-super-admin)
              if [[ -n "$ACCOUNT_MOBILE" ]]; then
                echo "Leave mobile empty for a Super Admin setup invitation; the invitee will set it."
                exit 1
              fi
              ;;
            invite-staff)
              if [[ -n "$ACCOUNT_MOBILE" ]]; then
                echo "Leave mobile empty for a Staff setup invitation; the invitee will set it."
                exit 1
              fi
              ;;
            invite-admin)
              if [[ -n "$ACCOUNT_MOBILE" ]]; then
                echo "Leave mobile empty for an Admin setup invitation; the invitee will set it."
                exit 1
              fi
              ;;
            *)
              echo "Unsupported account role action."
              exit 1
              ;;
          esac

      - name: Check out approved main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assign role or send a setup invitation
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.PRODUCTION_JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPER_ADMIN_INVITATION_FROM_EMAIL: ${{ vars.SUPER_ADMIN_INVITATION_FROM_EMAIL }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          CORS_ORIGINS: ${{ vars.PUBLIC_APP_URL }}
          ACCOUNT_ACTION: ${{ inputs.action }}
          ADMIN_EMAIL: ${{ inputs.email }}
          ADMIN_MOBILE: ${{ inputs.mobile }}
          SUPER_ADMIN_EMAIL: ${{ inputs.email }}
          SUPER_ADMIN_MOBILE: ${{ inputs.mobile }}
          SUPER_ADMIN_INVITATION_EMAIL: ${{ inputs.email }}
          STAFF_INVITATION_EMAIL: ${{ inputs.email }}
          STAFF_POSITION: ${{ inputs.position }}
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_URL" || -z "$JWT_SECRET" ]]; then
            echo "Configure PRODUCTION_DATABASE_URL and PRODUCTION_JWT_SECRET in the protected production environment."
            exit 1
          fi
          case "$ACCOUNT_ACTION" in
            promote-admin) npm run accounts:promote-admin -- --confirm ;;
            invite-admin)
              if [[ -z "$RESEND_API_KEY" || -z "$SUPER_ADMIN_INVITATION_FROM_EMAIL" ]]; then
                echo "Configure RESEND_API_KEY and SUPER_ADMIN_INVITATION_FROM_EMAIL before inviting an Admin."
                exit 1
              fi
              npm run accounts:invite-admin -- --confirm --email "$ADMIN_EMAIL"
              ;;
            promote-super-admin) npm run accounts:promote-super-admin -- --confirm ;;
            invite-super-admin)
              if [[ -z "$RESEND_API_KEY" || -z "$SUPER_ADMIN_INVITATION_FROM_EMAIL" ]]; then
                echo "Configure RESEND_API_KEY and SUPER_ADMIN_INVITATION_FROM_EMAIL before inviting a Super Admin."
                exit 1
              fi
              npm run accounts:invite-super-admin -- --confirm
              ;;
            invite-staff)
              if [[ -z "$RESEND_API_KEY" || -z "$SUPER_ADMIN_INVITATION_FROM_EMAIL" ]]; then
                echo "Configure RESEND_API_KEY and SUPER_ADMIN_INVITATION_FROM_EMAIL before inviting Staff."
                exit 1
              fi
              npm run accounts:invite-staff -- --confirm --email "$STAFF_INVITATION_EMAIL" --position "${STAFF_POSITION:-Staff}"
              ;;
            *) echo "Unsupported account role or invitation action."; exit 1 ;;
          esac

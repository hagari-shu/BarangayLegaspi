services:
  node-db:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in .env.hostinger}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env.hostinger}
      NODE_DB_NAME: ${NODE_DB_NAME:?Set NODE_DB_NAME in .env.hostinger}
      NODE_DB_USER: ${NODE_DB_USER:?Set NODE_DB_USER in .env.hostinger}
      NODE_DB_PASSWORD: ${NODE_DB_PASSWORD:?Set NODE_DB_PASSWORD in .env.hostinger}
      INIT_NODE_DATABASE: "true"
      INIT_LARAVEL_DATABASE: "false"
    volumes:
      - node_postgres_data:/var/lib/postgresql/data
      - ./deploy/hostinger/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile.hostinger
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://${NODE_DB_USER:?Set NODE_DB_USER in .env.hostinger}:${NODE_DB_PASSWORD:?Set NODE_DB_PASSWORD in .env.hostinger}@node-db:5432/${NODE_DB_NAME:?Set NODE_DB_NAME in .env.hostinger}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.hostinger}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      MFA_ENCRYPTION_KEY_PREVIOUS: ${MFA_ENCRYPTION_KEY_PREVIOUS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.hostinger}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL in .env.hostinger}
      SKIP_SEED: "true"
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      RESET_DELIVERY_URL: ${RESET_DELIVERY_URL:-}
      RESET_DELIVERY_TOKEN: ${RESET_DELIVERY_TOKEN:-}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-false}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-}
    depends_on:
      node-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.hostinger
      target: web
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  laravel-db:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    profiles: ["laravel-staging"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in .env.hostinger}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env.hostinger}
      LARAVEL_DB_NAME: ${LARAVEL_DB_NAME:-barangay_laravel}
      LARAVEL_DB_USER: ${LARAVEL_DB_USER:-barangay_laravel}
      LARAVEL_DB_PASSWORD: ${LARAVEL_DB_PASSWORD:-}
      INIT_NODE_DATABASE: "false"
      INIT_LARAVEL_DATABASE: "true"
    volumes:
      - laravel_postgres_data:/var/lib/postgresql/data
      - ./deploy/hostinger/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  laravel-api:
    build:
      context: ./laravel-api
      dockerfile: Dockerfile
    profiles: ["laravel-staging"]
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${LARAVEL_APP_KEY:-}
      APP_URL: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL in .env.hostinger}
      APP_TIMEZONE: Asia/Manila
      JWT_SECRET: ${LARAVEL_JWT_SECRET:-}
      DATABASE_URL: postgresql://${LARAVEL_DB_USER:-barangay_laravel}:${LARAVEL_DB_PASSWORD:-}@laravel-db:5432/${LARAVEL_DB_NAME:-barangay_laravel}
      MFA_ENCRYPTION_KEY: ${LARAVEL_MFA_ENCRYPTION_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.hostinger}
      PUBLIC_CONTENT_API_BASE: ${PUBLIC_CONTENT_API_BASE:-https://barangaylegaspi.onrender.com/api}
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      laravel-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$response = @file_get_contents('http://127.0.0.1/api/health'); $$health = $$response === false ? null : json_decode($$response, true); exit(is_array($$health) && ($$health['ok'] ?? false) === true && ($$health['storage'] ?? '') === 'pgsql' ? 0 : 1);"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  node_postgres_data:
  laravel_postgres_data:
  laravel_storage:

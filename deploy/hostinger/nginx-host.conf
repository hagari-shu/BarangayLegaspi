server {
    listen 80;
    listen [::]:80;
    server_name barangay-legaspi.gov.ph www.barangay-legaspi.gov.ph;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name barangay-legaspi.gov.ph www.barangay-legaspi.gov.ph;

    ssl_certificate /etc/letsencrypt/live/barangay-legaspi.gov.ph/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/barangay-legaspi.gov.ph/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
